<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Group | Splitixy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="create-group-page">
<div class="app-shell">
    <header class="app-header">
        <nav class="app-nav" aria-label="Main navigation">
            <a th:href="@{/dashboard}">Dashboard</a>
            <a th:href="@{/my-groups}">My Groups</a>
        </nav>
    </header>

    <main class="page-content">
        <header class="page-heading">
            <h1>Create a group</h1>
            <p>Create a group to start sharing expenses.</p>
        </header>

        <p th:if="${param.error}" class="status-message" role="alert">
            Please enter a group name before creating the group.
        </p>

        <form th:action="@{/create-group}" method="post" class="app-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-field">
                <label for="groupName">Group name</label>
                <input id="groupName" type="text" name="groupName"
                       placeholder="Enter group name" autocomplete="off" required>
            </div>
            <div class="form-actions">
                <button class="app-button" type="submit">Create group</button>
                <a class="app-button-secondary" th:href="@{/dashboard}">Cancel</a>
            </div>
        </form>

        <a class="back-link" th:href="@{/dashboard}">← Back to dashboard</a>
    </main>
</div>
</body>
</html>
