<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Splitixy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <script th:src="@{/js/auth.js}" defer></script>
</head>
<body>
<main class="auth-layout auth-register">
    <header class="auth-topbar">
        <nav class="auth-nav" aria-label="Main navigation">
            <a class="nav-button nav-login" th:href="@{/login}">Login</a>
        </nav>
    </header>

    <section class="auth-main" aria-labelledby="page-title">
        <div class="auth-content">
            <header class="form-heading">
                <h1 id="page-title">Create your account</h1>
                <p>Join Splitixy and start splitting expenses today.</p>
            </header>

            <p th:if="${param.error}" class="form-alert" role="alert">
                Registration could not be completed. Check your details or try another account.
            </p>

            <form th:action="@{/register}" method="post" class="auth-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="field">
                    <label for="register-name">Full name</label>
                    <div class="field-control">
                        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="8" r="3.5"/>
                            <path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>
                        </svg>
                        <input id="register-name" type="text" name="name" autocomplete="name"
                               placeholder="Your name" required>
                    </div>
                </div>

                <div class="field">
                    <label for="register-email">Email</label>
                    <div class="field-control">
                        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3.5" y="5.5" width="17" height="13" rx="2"/>
                            <path d="m4.5 7 7.5 6 7.5-6"/>
                        </svg>
                        <input id="register-email" type="email" name="email" autocomplete="email"
                               placeholder="you@example.com" required>
                    </div>
                </div>

                <div class="field">
                    <label for="register-password">Password</label>
                    <div class="password-field">
                        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="4" y="10" width="16" height="11" rx="2"/>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/>
                        </svg>
                        <input id="register-password" type="password" name="password"
                               autocomplete="new-password" placeholder="At least 8 characters"
                               minlength="8" required>
                        <button class="password-toggle" type="button" data-toggle-password
                                aria-controls="register-password" aria-label="Show password">Show</button>
                    </div>
                </div>

                <button type="submit" class="primary-button">Create account</button>
            </form>

            <div class="divider"><span>OR CONTINUE WITH</span></div>

            <div class="social-buttons">
                <a class="social-button" th:href="@{/oauth2/authorization/google}">
                    <span class="google-mark" aria-hidden="true">G</span>
                    <span>Continue with Google</span>
                </a>
                <a class="social-button" th:href="@{/oauth2/authorization/github}">
                    <svg class="github-mark" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.54v-2.1c-3.1.68-3.76-1.32-3.76-1.32-.5-1.29-1.24-1.63-1.24-1.63-1.01-.7.08-.69.08-.69 1.12.08 1.71 1.15 1.71 1.15 1 1.7 2.62 1.21 3.26.92.1-.72.39-1.21.71-1.49-2.48-.28-5.09-1.24-5.09-5.53 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.15a10.6 10.6 0 0 1 5.55 0c2.11-1.44 3.05-1.15 3.05-1.15.61 1.54.23 2.68.11 2.96.72.78 1.15 1.78 1.15 3 0 4.3-2.61 5.25-5.1 5.52.4.35.76 1.03.76 2.08v3.09c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/>
                    </svg>
                    <span>Continue with GitHub</span>
                </a>
            </div>

            <p class="auth-switch">Already have an account? <a th:href="@{/login}">Log in</a></p>
        </div>
    </section>
</main>
</body>
</html>
