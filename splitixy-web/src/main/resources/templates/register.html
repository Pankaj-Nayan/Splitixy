<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Splitixy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/register.css}">

</head>

<body>

<nav>

    <div class="logo">
        Splitixy
    </div>

    <div class="nav-links">

        <a th:href="@{/}">
            Home
        </a>

        <a th:href="@{/login}" class="login-btn">
            Login
        </a>

    </div>

</nav>

<section class="hero">

    <!-- LEFT -->

    <div class="left">

        <h1>
            Create Your<br>
            Account.
        </h1>

        <p>
            Join Splitixy and start splitting expenses today.
        </p>

        <p th:if="${param.error}" class="error" role="alert">
            Registration could not be completed. Check your details or try another account.
        </p>

        <form th:action="@{/register}" method="post" class="register-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <input type="text"
                   name="name"
                   class="form-control"
                   placeholder="Full Name"
                   required>

            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="Email"
                   required>

            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Password"
                   minlength="8"
                   required>

            <button type="submit" class="btn-register">
                Create Account
            </button>

        </form>
        <div class="bottom">

            Already have an account?

            <a th:href="@{/login}">
                Login
            </a>
            <a th:href="@{/oauth2/authorization/github}">
                Continue with GitHub
            </a>


            <div class="google-login">
                <a th:href="@{/oauth2/authorization/google}">
                    Continue with Google
                </a>
            </div>



        </div>

    </div>

    <!-- RIGHT -->

    <div class="right">

        <img
                th:src="@{/images/celebi.png}"
                class="celebi"
                alt="Celebi">

    </div>

</section>

</body>

</html>
