<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Group - Splitixy</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="create-group-container">

    <div class="create-group-card">

        <!-- ========================= -->
        <!-- GROUP MEMBERS -->
        <!-- ========================= -->

        <h1>Group Members</h1>

        <p>Members in this group</p>


        <div th:if="${users.isEmpty()}">

            <p>No members yet.</p>

        </div>


        <div th:unless="${users.isEmpty()}">

            <div th:each="user : ${users}">

                <p>
                    👤
                    <span th:text="${user.fullName}">
                        User
                    </span>
                </p>

            </div>

        </div>


        <br>


        <!-- ========================= -->
        <!-- EXPENSES -->
        <!-- ========================= -->

        <h2>💰 Expenses</h2>


        <div th:if="${expenses.isEmpty()}">

            <p>No expenses yet.</p>

        </div>


        <div th:unless="${expenses.isEmpty()}">

            <div th:each="expense : ${expenses}">

                <p>

                    <strong
                            th:text="${expense.description}">
                        Dinner
                    </strong>

                    -

                    ₹<span
                        th:text="${expense.amount}">
                        0
                    </span>

                </p>

            </div>

        </div>


        <br>


        <!-- Add Expense -->

        <a th:href="@{'/group/' + ${groupId} + '/expense/add'}">

            <button type="button">

                💸 Add Expense

            </button>

        </a>


        <br>
        <br>


        <!-- ========================= -->
        <!-- BALANCES -->
        <!-- ========================= -->

        <h2>⚖️ Balances</h2>

        <div th:if="${debts.isEmpty()}">

            <p>Everyone is settled. 🎉</p>

        </div>

        <div th:unless="${debts.isEmpty()}">

            <div th:each="debt : ${debts}">

                <p>

                    <strong th:text="${debt.debtor}">
                        Person
                    </strong>

                    owes

                    <strong th:text="${debt.creditor}">
                        Person
                    </strong>

                    ₹<span
                        th:text="${#numbers.formatDecimal(debt.amount, 1, 2)}">
                0.00
            </span>

                </p>

            </div>

        </div>

        <br>


        <!-- ========================= -->
        <!-- ADD MEMBER -->
        <!-- ========================= -->

        <h2>Add Member</h2>


        <form
                th:action="@{'/group/' + ${groupId} + '/add-member'}"
                method="post">


            <select name="userId"
                    required>

                <option value="">

                    Select User

                </option>


                <option
                        th:each="u : ${allUsers}"
                        th:value="${u.id}"
                        th:text="${u.fullName}">

                </option>

            </select>


            <button type="submit">

                Add Member

            </button>

        </form>


        <br>


        <!-- ========================= -->
        <!-- BACK -->
        <!-- ========================= -->

        <a th:href="@{/my-groups}">

            ← Back to My Groups

        </a>

    </div>

</div>

</body>

</html>
