<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Expense | Splitixy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="container mt-5">

    <div class="card p-4 mx-auto"
         style="max-width: 500px;">

        <h2 class="mb-4">💸 Add Expense</h2>

        <form th:action="@{'/group/' + ${groupId} + '/expense/add'}"
              method="post">

            <div class="mb-3">

                <label class="form-label">
                    Description
                </label>

                <input type="text"
                       name="description"
                       class="form-control"
                       placeholder="e.g. Dinner"
                       required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Amount
                </label>

                <input type="number"
                       name="amount"
                       class="form-control"
                       step="0.01"
                       min="0.01"
                       placeholder="e.g. 1200"
                       required>

            </div>


            <button type="submit"
                    class="btn btn-primary">

                Add Expense

            </button>


            <a th:href="@{'/group/' + ${groupId}}"
               class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

</body>

</html>
